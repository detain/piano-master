# KeyQuest CI skeleton — plan P0.1.3.
#
# Five mandatory, gating jobs. A PR that breaks any workspace is red before
# review. Total wall-clock target < 10 minutes; flakiness is fixed the day it
# appears, not triaged (plan P0.1.3).
#
# Every job runs its final check — the degraded fallback branches were removed
# once the real artifacts landed (Gradle wrapper, phpunit.xml.dist,
# package-lock.json). See .github/workflows/README.md for the current state.

name: CI

on:
  push:
    # Default branch is `master`; `main` kept as a belt-and-braces alias.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Engine host tests — C++20 core, Linux host only, no device needed.
  # ---------------------------------------------------------------------------
  engine-host-tests:
    name: Engine host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure, build, and run host tests
        run: |
          set -euxo pipefail
          cd engine
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      # The wrapper->CLI integration (pipeline EngineYinWrapper shelling out
      # to engine/build/yin_cli) otherwise only ever runs locally. yin_cli is
      # already built by the host-test step above (it is an ALL target); this
      # installs the handful of runtime deps the engine_yin test imports and
      # runs just that test. Keep it cheap: no editable install, no librosa.
      - name: Install pipeline eval deps
        run: |
          set -euxo pipefail
          python3 -m venv /tmp/keyquest-eval-venv
          /tmp/keyquest-eval-venv/bin/pip install --quiet \
            numpy soundfile mir_eval pretty_midi pytest jsonschema music21

      - name: Run EngineYinWrapper integration test
        env:
          PYTHONPATH: pipeline
        run: |
          set -euxo pipefail
          /tmp/keyquest-eval-venv/bin/pytest \
            pipeline/tests/test_eval_harness.py -k engine_yin -q

      # SongPack v1 (plan §20 P1.1): the Python consumer validates the golden
      # fixtures + negative/forward-compat cases against the CANONICAL schema.
      # The other consumers run in their own jobs: PHP in api-tests (phpunit
      # picks up tests/SongPack), Kotlin in android-unit (testDebugUnitTest
      # reads the schema via the generated test-resources copy).
      - name: Run SongPack v1 schema + fixtures validation
        env:
          PYTHONPATH: pipeline
        run: |
          set -euxo pipefail
          /tmp/keyquest-eval-venv/bin/pytest \
            pipeline/tests/test_songpack_validator.py -q

      # P1.2 pipeline CLI v0 (plan §20 P1.2): the stage suite (repeat
      # state machine, golden-path builds, bad-input corpus, audio stems).
      # The sine renderer needs only pip deps + ffmpeg (for loudnorm + Opus);
      # the runner image does not put ffmpeg on PATH, so install it.
      - name: Install ffmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run P1.2 pipeline suite
        env:
          PYTHONPATH: pipeline
        run: |
          set -euxo pipefail
          /tmp/keyquest-eval-venv/bin/pytest \
            pipeline/tests/test_repeat_expansion.py \
            pipeline/tests/test_build_stages.py \
            pipeline/tests/test_bad_input.py \
            pipeline/tests/test_audio_stems.py -q

      # Determinism (plan §8.2.10): build every golden fixture twice into
      # separate stores/builds dirs and byte-compare the packs. A difference
      # is real nondeterminism — worth stopping to fix.
      - name: Determinism — build golden fixtures twice and byte-compare
        env:
          PYTHONPATH: pipeline
        run: |
          set -euxo pipefail
          KEYQUEST_STORE_DIR="$RUNNER_TEMP/det-a/store" \
            KEYQUEST_BUILDS_DIR="$RUNNER_TEMP/det-a/builds" \
            /tmp/keyquest-eval-venv/bin/python pipeline/scripts/build_golden.py
          KEYQUEST_STORE_DIR="$RUNNER_TEMP/det-b/store" \
            KEYQUEST_BUILDS_DIR="$RUNNER_TEMP/det-b/builds" \
            /tmp/keyquest-eval-venv/bin/python pipeline/scripts/build_golden.py
          count=0
          for pack in "$RUNNER_TEMP"/det-a/builds/golden-*/packs/*.pack; do
            other="${pack/det-a/det-b}"
            cmp "$pack" "$other"
            count=$((count + 1))
          done
          echo "OK: $count golden packs byte-identical across the two builds"

  # ---------------------------------------------------------------------------
  # 2. Android unit tests — JVM tests only, no emulator.
  #    The Gradle wrapper IS committed and pins Gradle 8.11.1; the job runs it
  #    directly (no toolchain-gradle fallback).
  # ---------------------------------------------------------------------------
  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Provision the Android SDK for API 36 (match the app's compileSdk).
      # TODO(P0.1.2): keep the platform level in sync with /toolchain.md.
      # NOTE: setup-android@v3 splits `packages` on SPACES (verified in action
      # source: getInput("packages").split(" ")), not commas — each token is
      # passed to sdkmanager as one package.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      # Caches the Gradle user home (dependencies + build cache).
      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (debug)
        run: |
          set -euxo pipefail
          cd android
          # Wrapper is committed (gradlew + gradle/wrapper/gradle-wrapper.jar)
          # and pins Gradle 8.11.1.
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
        # --stacktrace emits nothing on a green run and gives a usable trace on
        # a red one — always passing it avoids paying for a second run.

  # ---------------------------------------------------------------------------
  # 3. API tests — PHPUnit + MySQL + Dragonfly service containers.
  # ---------------------------------------------------------------------------
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: keyquest_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      dragonfly:
        # Pinned image tag per plan §13.5 (Dragonfly compatibility fence);
        # matches /toolchain.md. Pull from GHCR (ghcr.io/dragonflydb/dragonfly):
        # the Docker Hub repo only carries stale tags and 404s on current ones.
        image: ghcr.io/dragonflydb/dragonfly:v1.29.0
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, mbstring, json
          tools: composer:v2

      - name: Install dependencies
        run: |
          set -euxo pipefail
          cd api
          composer install --no-interaction --prefer-dist

      # The MySQL service container creates only `keyquest_test` (zero tables).
      # Apply the init SQL in a step instead of mounting api/docker/mysql-init
      # into /docker-entrypoint-initdb.d: a service starts BEFORE checkout, so
      # the docker daemon creates the mount source (api/docker) as root inside
      # the still-empty workspace and actions/checkout's clean step fails with
      # EACCES on rmdir. pdo_mysql is guaranteed by setup-php above.
      - name: Apply schema to test database
        run: |
          set -euxo pipefail
          cd api
          php -r '
            $pdo = new PDO(
              "mysql:host=127.0.0.1;port=3306;dbname=keyquest_test",
              "root",
              ""
            );
            $pdo->exec(file_get_contents("docker/mysql-init/01_schema.sql"));
          '

      - name: Run test suite
        # The MySQL service container creates only `keyquest_test`; point the
        # app at it (config/database.php defaults DB_DATABASE to `keyquest`).
        # root / empty password match MYSQL_ALLOW_EMPTY_PASSWORD=yes.
        env:
          DB_DATABASE: keyquest_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          set -euxo pipefail
          cd api
          vendor/bin/phpunit --configuration phpunit.xml.dist

  # ---------------------------------------------------------------------------
  # 4. CMS build — Vue 3 + Vite + TypeScript production build.
  # ---------------------------------------------------------------------------
  cms-build:
    name: CMS build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pin Node 24 explicitly (matches /toolchain.md and the ubuntu-24.04
      # runner default; avoids setup-node's Node 20 deprecation warning).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # package-lock.json is committed at cms/package-lock.json; point the
          # cache at it explicitly — setup-node would otherwise search the repo
          # root and fail with "Dependencies lock file is not found".
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        run: |
          set -euxo pipefail
          cd cms
          # package-lock.json is committed — npm ci for reproducible installs.
          npm ci

      - name: Build
        run: |
          set -euxo pipefail
          cd cms
          npm run build

      - name: Run lint
        run: |
          set -euxo pipefail
          cd cms
          npm run lint

  # ---------------------------------------------------------------------------
  # 5. Cross-workspace lint greps — plan §13.4.2 Webman state-hygiene rules.
  #    These run from day one, before there is code to violate them (P2.A1).
  # ---------------------------------------------------------------------------
  lint-all:
    name: Lint all workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          set -euxo pipefail
          find api -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -r -n1 php -l

      - name: Forbid exit()/die() outside start.php
        run: |
          set -euxo pipefail
          # exit()/die() kills the Workerman worker, not the request (§13.4.2).
          # start.php lives outside the scanned dirs, so bootstrap exits are
          # allowed there.
          if grep -rnE 'exit\s*\(|\bdie\s*\(' api/app api/config api/support; then
            echo "::error::exit()/die() found in api/app, api/config, api/support — return a response object instead (§13.4.2)." >&2
            exit 1
          fi

      - name: Forbid superglobal reads in app and config
        run: |
          set -euxo pipefail
          # Superglobals are not populated per request in long-lived workers;
          # use $request->get()/post()/header()/session() (§13.4.2).
          if grep -rnE '\$_(GET|POST|SERVER|SESSION|REQUEST|COOKIE|FILES|ENV)' api/app api/config; then
            echo "::error::superglobal read found in api/app or api/config — use the \$request object (§13.4.2)." >&2
            exit 1
          fi

      - name: Python compile check
        run: |
          set -euxo pipefail
          files=$(find pipeline -name '*.py' -not -path '*/__pycache__/*')
          if [ -n "$files" ]; then
            python -m py_compile $files
          fi

      - name: Trailing whitespace check
        run: |
          set -euxo pipefail
          # Cheap, deterministic .editorconfig stand-in (no npx downloads).
          if grep -rn '[[:blank:]]$' \
            engine android api cms pipeline \
            --include='*.cpp' --include='*.h' \
            --include='*.kt' --include='*.kts' \
            --include='*.php' --include='*.py' \
            --include='*.ts' --include='*.tsx' --include='*.vue' \
            --include='*.json' --include='*.yml' --include='*.yaml' \
            --exclude-dir=vendor --exclude-dir=node_modules \
            --exclude-dir=build --exclude-dir=.gradle \
            --exclude-dir=dist --exclude-dir=__pycache__; then
            echo "::error::trailing whitespace found — remove it (editorconfig sanity, plan P0.1.3)." >&2
            exit 1
          fi

      - name: SongPack schema drift guard — one canonical file, three consumers
        run: |
          set -euxo pipefail
          # Plan §8.1.10: the canonical schema is content/schema/songpack-v1.json
          # and every consumer — Python pipeline, PHP API, Kotlin tests — reads
          # THAT file, never a committed copy. The android consumer's copy is
          # GENERATED into build/generated/songpack (gitignored, so it never
          # appears in this fresh checkout); any other songpack-v1.json in the
          # tree would be drift by construction, so if one exists it must be
          # byte-identical to the canonical file or this job fails.
          canonical="content/schema/songpack-v1.json"
          canonical_sha="$(sha256sum "$canonical" | cut -d' ' -f1)"
          copies="$(find . -name 'songpack-v1.json' \
            -not -path './content/schema/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/vendor/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' || true)"
          if [ -n "$copies" ]; then
            for copy in $copies; do
              copy_sha="$(sha256sum "$copy" | cut -d' ' -f1)"
              if [ "$copy_sha" != "$canonical_sha" ]; then
                echo "::error::SongPack schema drift: $copy differs from canonical $canonical (plan §8.1.10)" >&2
                exit 1
              fi
              echo "OK: $copy is byte-identical to canonical $canonical"
            done
          fi
          echo "OK: no stray songpack-v1.json copies — canonical file is the only source of truth"
