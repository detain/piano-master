# JVM memory for the Gradle daemon (Kotlin/Compose builds are memory hungry).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Use AndroidX artifacts (required: all UI deps are androidx).
android.useAndroidX=true
# Official Kotlin code style (matches ktlint defaults we plan to adopt in CI).
kotlin.code.style=official
# Build cache + parallel module builds: 5-job CI budget (plan P0.1.3) depends on it.
org.gradle.caching=true
org.gradle.parallel=true