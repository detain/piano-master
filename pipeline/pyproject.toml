[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyquest-pipeline"
version = "0.1.0"
description = "KeyQuest content build pipeline: MusicXML/MIDI source → SongPack (plan §8.2)"
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = [
    "music21>=9,<10",
    "mido>=1.3,<2",
    "numpy>=1.26,<3",
    "scipy>=1.14,<2",
    "jsonschema>=4,<5",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "mir_eval>=0.7,<1",
    "soundfile>=0.12,<1",
    "pretty_midi>=0.2.10,<1",
    "librosa>=0.10,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "hypothesis>=6,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"