# KeyQuest API — local dev dependencies (P0.6.1 spike).
#
# Pinned images per toolchain.md:
#   MySQL      mysql:8.0.43
#   Dragonfly  ghcr.io/dragonflydb/dragonfly:v1.29.0
#
# Usage (from api/):
#   docker compose up -d
#   php start.php start
#
# Both services expose default ports on 127.0.0.1 and have healthchecks so
# `docker compose ps` shows them healthy before the API boots.
#
# MySQL data lives in the named volume keyquest-mysql-data and survives
# `docker compose down`/`up`. The mysql-init schema mount runs only on first
# init of an EMPTY data dir; to re-run it, wipe the volume:
#   docker compose down -v

services:
  mysql:
    image: mysql:8.0.43
    container_name: keyquest-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: keyquest
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v1.29.0
    container_name: keyquest-dragonfly
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mysql-data:
    name: keyquest-mysql-data